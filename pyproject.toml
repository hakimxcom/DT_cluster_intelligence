[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-intelligence"
version = "0.1.0"
description = "Regional economic intelligence comparing Detroit, Chicago, and Cleveland through industry clusters, employment, wages, and economic indicators."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "h-hakim" }]
dependencies = [
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
